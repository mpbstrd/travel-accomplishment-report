# Docker Compose Configuration
# 
# NOTE: This project now uses SQLite for local development.
# No Docker containers are required to run the application.
# 
# This file is kept for reference and can be used if you want to
# run production databases (PostgreSQL, MS SQL Server, MySQL) locally.
#
# To use SQLite (default):
#   - Just run: npm start
#   - No Docker needed
#   - Database file: ./src/data/signature_workflow.db
#
# To use PostgreSQL for production testing:
#   - Uncomment the postgres service below
#   - Update .env with PostgreSQL settings
#   - Run: docker-compose up -d

version: '3.8'

services:
  # PostgreSQL (Recommended for Production)
